<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Progressive Helix (hx) keystroke drills and a guided tutorial for people who mostly edit Markdown, YAML and config files. Runs in the browser.">
<meta property="og:title" content="Helix Reps">
<meta property="og:description" content="Progressive Helix (hx) keystroke drills and a guided tutorial for people who mostly edit Markdown, YAML and config files. Runs in the browser.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://hxreps.puddingtime.net/">
<style>html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Helix Reps</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: stage ladder on the left, one drill card on the right; the buffer is the hero. Palette borrows Helix's own default theme. */
:root{
  --bg:#f4f0f8; --panel:#ffffff; --panel2:#ebe4f3; --fg:#2a1838; --muted:#6d5f7d; --line:#d8cde4;
  --accent:#5b2d91; --accent-fg:#ffffff; --sel:#dccbf2; --cur:#5b2d91; --cur-fg:#ffffff; --cur2:#9a7bc4;
  --star:#a86a00; --ok:#1f7a45; --evil:#b83a26;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#281733; --panel:#3b224c; --panel2:#452859; --fg:#eadff5; --muted:#b3a3c7; --line:#5a3d6e;
  --accent:#b9b5f5; --accent-fg:#281733; --sel:#6b3fa6; --cur:#dbbfef; --cur-fg:#281733; --cur2:#a4a0e8;
  --star:#efba5d; --ok:#9ff28f; --evil:#f79a8d; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#281733; --panel:#3b224c; --panel2:#452859; --fg:#eadff5; --muted:#b3a3c7; --line:#5a3d6e;
  --accent:#b9b5f5; --accent-fg:#281733; --sel:#6b3fa6; --cur:#dbbfef; --cur-fg:#281733; --cur2:#a4a0e8;
  --star:#efba5d; --ok:#9ff28f; --evil:#f79a8d; color-scheme:dark }

body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding-block:28px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:20px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,#card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
kbd{font-family:var(--mono);font-size:.86em;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:1px 6px;white-space:nowrap}

.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
h1{font-size:26px;font-weight:600;margin:0;letter-spacing:-.01em}
.sub{margin:2px 0 0;color:var(--muted)}
.stats{display:flex;gap:18px;align-items:baseline;font-variant-numeric:tabular-nums}
.stats b{font-weight:600}
.stats .st{color:var(--star)}
.modes{display:flex;gap:6px}
.modes button{background:transparent;border:1px solid var(--line);border-radius:6px;padding:6px 14px}
.modes button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}

.grid{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:800px){.grid{grid-template-columns:minmax(0,1fr)}}
#stages{display:flex;flex-direction:column;gap:6px}
.stage{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border:1px solid transparent;border-radius:8px}
.stage.on{background:var(--panel);border-color:var(--line)}
.stage.locked{opacity:.5}
.stage-h{display:flex;justify-content:space-between;gap:8px;background:none;border:0;padding:0;text-align:left;font-weight:500;width:100%}
.stage-h span:last-child{color:var(--muted);font-variant-numeric:tabular-nums;font-weight:400}
.dots{display:flex;flex-wrap:wrap;gap:4px}
.dot{width:18px;height:18px;border-radius:4px;border:1px solid var(--line);background:transparent;padding:0;font-size:10px;line-height:16px;color:var(--star)}
.dot.s1,.dot.s2,.dot.s3{background:var(--panel2)}
.dot.here{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.lockmsg{font-size:12px;color:var(--muted)}

#card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.eyebrow{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:space-between;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.task{font-size:20px;font-weight:500;margin:0;text-wrap:balance}
.chips{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:13px}
.chip{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}
.chip.vim .lab{color:var(--muted)}
.chip.hx .lab{color:var(--ok);font-weight:600}
.link.doc{margin-left:auto;font-size:13px}
.next .link.doc{margin-left:0}
.link{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.panes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:640px){.panes{grid-template-columns:minmax(0,1fr)}}
.pane{min-width:0;display:flex;flex-direction:column;gap:6px}
.pane h3{margin:0;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.buf{font-family:var(--mono);font-size:17px;line-height:1.65;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:12px 14px;overflow-x:auto;min-height:5.2em}
.buf .ln{white-space:pre}
.buf span.sel{background:var(--sel)}
.buf span.cur{background:var(--cur);color:var(--cur-fg)}
.buf span.cur2{background:var(--cur2);color:var(--cur-fg)}
.buf span.ibar{box-shadow:inset 2px 0 0 var(--cur)}
.buf.goal{opacity:.92}
.statusline{font-family:var(--mono);font-size:13px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.modetag{background:var(--accent);color:var(--accent-fg);padding:0 8px;border-radius:3px;font-weight:600}
.statusline .pend{color:var(--accent);min-width:3ch}
.statusline .right{margin-left:auto;color:var(--muted)}
.statusline .over{color:var(--evil)}
.tape{display:flex;flex-wrap:wrap;gap:4px;min-height:26px;align-items:center}
.tape .none{color:var(--muted);font-size:13px}
.recall{font-family:var(--mono);font-size:22px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:26px 14px;text-align:center;min-height:1.6em;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.recall .none{color:var(--muted);font-size:15px;font-family:var(--sans)}
.recall.miss{border-color:var(--evil)}
.result{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:6px}
.result .stars{color:var(--star);font-size:20px;letter-spacing:2px}
.result .head{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;font-variant-numeric:tabular-nums}
.result .why{margin:0;max-width:65ch}
.result .next{color:var(--muted);font-size:13px}
.flash{color:var(--ok);font-size:13px;min-height:1.5em}
.focus-hint{font-size:13px;color:var(--evil)}
#card:focus .focus-hint,#card:focus-within .focus-hint{visibility:hidden}
.say{max-width:68ch;font-size:16px}
.say p{margin:0 0 .6em}
.say p:last-child{margin-bottom:0}
.say code{font-family:var(--mono);background:var(--sel);padding:0 4px;border-radius:3px}
.say.after{border-left:3px solid var(--ok);padding-left:12px}
.say .tw{overflow-x:auto;margin-top:10px}
.say table{border-collapse:collapse;font-size:14px}
.say th,.say td{text-align:left;padding:5px 18px 5px 0;border-bottom:1px solid var(--line);white-space:nowrap}
.say th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.mn{margin:0;max-width:65ch}
.mn b{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-right:6px}
.prompt{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.prompt .lab{color:var(--muted);font-size:13px;margin-right:4px}
.prompt kbd{font-size:15px;padding:3px 9px}
.prompt kbd.hit{opacity:.45}
.prompt kbd.nextk{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.prompt .misskey{color:var(--evil);font-size:13px;margin-left:6px}
.stage .ok{color:var(--ok)}
.big{font-size:40px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
footer{color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center}
footer .sp{margin-left:auto;display:flex;gap:14px}
@media (prefers-reduced-motion:no-preference){.result{animation:pop .18s ease-out}@keyframes pop{from{transform:translateY(4px);opacity:.4}to{transform:none;opacity:1}}}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Helix Reps</h1>
      <p class="sub">Helix practice for people who mostly edit Markdown, with some YAML and config files. Needs a hardware keyboard.</p>
    </div>
    <div class="stats"><span id="rank"></span><span class="st" id="starcount"></span></div>
  </header>
  <div class="modes">
    <button id="mTut" aria-pressed="false">Tutorial</button>
    <button id="mLadder" aria-pressed="true">Ladder</button>
    <button id="mSprint" aria-pressed="false">Sprint · 60s</button>
  </div>
  <div class="grid">
    <nav id="stages" aria-label="Stages"></nav>
    <div class="col">
    <main id="card" tabindex="0" aria-label="Drill"></main>
    </div>
  </div>
  <footer>
    <span><kbd>Tab</kbd> retry / skip</span><span><kbd>Enter</kbd> next, once solved</span><span><kbd>Ctrl-[</kbd> also works as Esc</span><span>Bindings follow the default keymap in the <a class="link" href="https://docs.helix-editor.com/keymap.html" target="_blank" rel="noopener">Helix docs</a>. Not affiliated with the Helix project.</span>
    <span class="sp"><button class="link" id="unlock"></button><button class="link" id="wipe">Reset progress</button></span>
  </footer>
</div>

<script>
/*ENGINE-START*/
const ML='⟦', MR='⟧';
function parse(src){let text='',sels=[],open=-1;for(const ch of src){if(ch===ML)open=text.length;else if(ch===MR)sels.push([open,text.length-1]);else text+=ch;}if(!text.endsWith('\n'))text+='\n';return{text,sels};}
const rng=s=>[Math.min(s.a,s.h),Math.max(s.a,s.h)];
const pt=p=>({a:p,h:p});
function lineStart(t,i){return i<=0?0:t.lastIndexOf('\n',i-1)+1;}
function lineEnd(t,i){return t.indexOf('\n',i);}
function cat(c,big){if(c===undefined||c==='\n')return'n';if(c===' '||c==='\t')return's';if(big)return'w';return /\w/.test(c)?'w':'p';}
function newState(text,sels,primary){return{text,sels:sels.map(([a,h])=>({a,h})),primary:primary||0,mode:'normal',pending:null,pcount:0,count:'',reg:[],search:null,lastFind:null,undo:[],redo:[],prompt:null,ins:null,keys:0};}
function norm(S){
  if(!S.text.endsWith('\n'))S.text+='\n';
  const n=S.text.length,cl=x=>Math.max(0,Math.min(n-1,x));
  const prim=S.sels[S.primary]||S.sels[0];
  const arr=S.sels.map(s=>({a:cl(s.a),h:cl(s.h),p:s===prim}));
  arr.sort((x,y)=>Math.min(x.a,x.h)-Math.min(y.a,y.h));
  const out=[];
  for(const s of arr){const last=out[out.length-1];
    if(last&&Math.min(s.a,s.h)<=Math.max(last.a,last.h)){const lo=Math.min(last.a,last.h),hi=Math.max(last.a,last.h,s.a,s.h),fwd=last.h>=last.a;last.a=fwd?lo:hi;last.h=fwd?hi:lo;last.p=last.p||s.p;}
    else out.push(s);}
  S.primary=Math.max(0,out.findIndex(s=>s.p));S.sels=out.map(({a,h})=>({a,h}));
}
function snap(S){S.undo.push({text:S.text,sels:S.sels.map(s=>({...s})),primary:S.primary});S.redo=[];}
function applyEdits(S,eds){let out='',last=0;const pos=[];for(const e of eds){out+=S.text.slice(last,e.from);pos.push(out.length);out+=e.text;last=e.to;}out+=S.text.slice(last);S.text=out;return pos;}
function mapPos(p,eds){let d=0;for(const e of eds){if(p>=e.to)d+=e.text.length-(e.to-e.from);else if(p>=e.from)return e.from+d;else break;}return p+d;}
function remap(S,eds){const old=S.sels;applyEdits(S,eds);S.sels=old.map(s=>({a:mapPos(s.a,eds),h:mapPos(s.h,eds)}));norm(S);}
function mv(S,fn,n){const ext=S.mode==='select';for(let c=0;c<(n||1);c++)S.sels=S.sels.map(s=>{const r=fn(s.h,s);if(!r)return s;return ext?{a:s.a,h:r.h}:r;});norm(S);}
function wNext(t,pos,big,end){const n=t.length;let p=pos;
  if(p+1<n&&cat(t[p],big)!==cat(t[p+1],big))p++;
  while(p<n&&t[p]==='\n')p++;
  if(p>=n)return null;
  let h=p;
  while(h+1<n){const a=cat(t[h],big),b=cat(t[h+1],big);if(a!==b&&(end?a!=='s':b!=='s'))break;h++;}
  return{a:p,h};}
function wPrev(t,pos,big){let p=pos;
  if(p-1>=0&&cat(t[p],big)!==cat(t[p-1],big))p--;
  while(p>=0&&t[p]==='\n')p--;
  if(p<0)return null;
  let h=p;
  while(h-1>=0){const a=cat(t[h-1],big),b=cat(t[h],big);if(a!==b&&b!=='s')break;h--;}
  return{a:p,h};}
function vmove(t,p,d){const ls=lineStart(t,p),col=p-ls;let nls;
  if(d>0){const le=lineEnd(t,p);if(le+1>=t.length)return p;nls=le+1;}else{if(ls===0)return p;nls=lineStart(t,ls-1);}
  const nle=lineEnd(t,nls);return nls+Math.min(col,Math.max(0,nle-nls-1));}
function findCh(t,pos,ch,kind,cnt){const fwd=kind==='f'||kind==='t',till=kind==='t'||kind==='T';let idx;
  if(fwd){idx=t.indexOf(ch,pos+(till?2:1));for(let c=1;c<cnt&&idx>=0;c++)idx=t.indexOf(ch,idx+1);if(idx<0)return null;return{a:pos,h:till?idx-1:idx};}
  const st=pos-(till?2:1);if(st<0)return null;idx=t.lastIndexOf(ch,st);for(let c=1;c<cnt&&idx>0;c++)idx=t.lastIndexOf(ch,idx-1);if(idx<0)return null;return{a:pos,h:till?idx+1:idx};}
const PAIRS={'(':'()',')':'()','[':'[]',']':'[]','{':'{}','}':'{}','<':'<>','>':'<>'};
const OBJ='()[]{}<>"\'`';
function pairOf(ch){const p=PAIRS[ch];return p?[p[0],p[1]]:[ch,ch];}
function matchFwd(t,o,op,cl){let d=0;for(let i=o;i<t.length;i++){if(t[i]===op)d++;else if(t[i]===cl){d--;if(d===0)return i;}}return-1;}
function matchBack(t,c,op,cl){let d=0;for(let i=c;i>=0;i--){if(t[i]===cl)d++;else if(t[i]===op){d--;if(d===0)return i;}}return-1;}
function findPair(t,pos,ch){const[op,cl]=pairOf(ch);
  if(op===cl){const ls=lineStart(t,pos);let cnt=0;for(let i=ls;i<pos;i++)if(t[i]===op)cnt++;let o,c;
    if(t[pos]===op){if(cnt%2===0){o=pos;c=t.indexOf(op,pos+1);}else{c=pos;o=t.lastIndexOf(op,pos-1);}}
    else{o=pos>0?t.lastIndexOf(op,pos-1):-1;c=t.indexOf(op,pos+1);}
    if(o<0||c<0||o<ls)return null;return[o,c];}
  let o=-1;
  if(t[pos]===op)o=pos;else if(t[pos]===cl)o=matchBack(t,pos,op,cl);
  else{let d=0;for(let i=pos-1;i>=0;i--){if(t[i]===cl)d++;else if(t[i]===op){if(d===0){o=i;break;}d--;}}}
  if(o<0)return null;const c=matchFwd(t,o,op,cl);return c<0?null:[o,c];}
function del(S,yank){snap(S);const rs=S.sels.map(rng);if(yank)S.reg=rs.map(([lo,hi])=>S.text.slice(lo,hi+1));
  const pos=applyEdits(S,rs.map(([lo,hi])=>({from:lo,to:hi+1,text:''})));S.sels=pos.map(pt);S.primary=Math.min(S.primary,S.sels.length-1);S.mode='normal';norm(S);}
function enterInsert(S,ps,append){S.sels=ps.map(pt);S.mode='insert';S.ins={append};norm(S);}
function paste(S,before,replace){if(!S.reg.length)return;snap(S);const t=S.text;const vals=[];
  const eds=S.sels.map((s,i)=>{const[lo,hi]=rng(s);const v=S.reg[Math.min(i,S.reg.length-1)];vals.push(v);
    if(replace)return{from:lo,to:hi+1,text:v};const lw=v.endsWith('\n');
    const at=before?(lw?lineStart(t,lo):lo):(lw?lineEnd(t,hi)+1:hi+1);return{from:at,to:at,text:v};});
  const pos=applyEdits(S,eds);S.sels=pos.map((p,i)=>({a:p,h:p+Math.max(1,vals[i].length)-1}));S.mode='normal';norm(S);}
function selLines(S,count,grow){const t=S.text,n=t.length;S.sels=S.sels.map(s=>{const[lo,hi]=rng(s);const ls=lineStart(t,lo);let le=lineEnd(t,hi);
  let extra=grow?(lo===ls&&hi===le?count:count-1):0;while(extra-->0&&le+1<n)le=lineEnd(t,le+1);return{a:ls,h:le};});norm(S);}
function caseOp(S,fn){snap(S);const eds=S.sels.map(s=>{const[lo,hi]=rng(s);return{from:lo,to:hi+1,text:fn(S.text.slice(lo,hi+1))};});const old=S.sels;applyEdits(S,eds);S.sels=old;norm(S);}
function indent(S,dir){snap(S);const t=S.text,starts=new Set();
  for(const s of S.sels){const[lo,hi]=rng(s);let ls=lineStart(t,lo);while(ls<=hi&&ls<t.length){starts.add(ls);ls=lineEnd(t,ls)+1;}}
  const eds=[...starts].sort((a,b)=>a-b).map(ls=>{if(dir>0)return t[ls]==='\n'?null:{from:ls,to:ls,text:'  '};let k=0;while(k<2&&t[ls+k]===' ')k++;return k?{from:ls,to:ls+k,text:''}:null;}).filter(Boolean);
  remap(S,eds);}
function copyDown(S){const t=S.text,add=[];
  for(const s of S.sels){const[lo,hi]=rng(s);const ls=lineStart(t,lo);if(lineStart(t,hi)!==ls)continue;const ca=s.a-ls,ch=s.h-ls,need=Math.max(ca,ch);let le=lineEnd(t,lo);
    while(le+1<t.length){const nls=le+1,nle=lineEnd(t,nls);if(nle-nls>need){add.push({a:nls+ca,h:nls+ch});break;}le=nle;}}
  if(add.length){S.sels=S.sels.concat(add);S.primary=S.sels.length-1;norm(S);}}
function splitLines(S){const t=S.text,out=[];
  for(const s of S.sels){const[lo,hi]=rng(s);let st=lo;for(let i=lo;i<=hi;i++)if(t[i]==='\n'){if(i>st)out.push({a:st,h:i-1});st=i+1;}if(st<=hi)out.push({a:st,h:hi});}
  if(out.length){S.sels=out;S.primary=0;norm(S);}}
function textObj(S,kind,ch){const t=S.text;
  S.sels=S.sels.map(s=>{let r=null;
    if(ch==='w'||ch==='W'){const big=ch==='W',c=cat(t[s.h],big);if(c==='n')return s;let lo=s.h,hi=s.h;
      while(lo>0&&cat(t[lo-1],big)===c)lo--;while(cat(t[hi+1],big)===c)hi++;
      if(kind==='a'){let e=hi;while(t[e+1]===' ')e++;if(e>hi)hi=e;else while(lo>0&&t[lo-1]===' ')lo--;}
      r=[lo,hi];}
    else if(ch==='p'){const blank=ls=>t[ls]==='\n';const ls=lineStart(t,s.h);if(blank(ls))return s;let top=ls;
      while(top>0&&!blank(lineStart(t,top-1)))top=lineStart(t,top-1);
      let end=lineEnd(t,ls);while(end+1<t.length&&!blank(end+1))end=lineEnd(t,end+1);
      if(kind==='a')while(end+1<t.length&&blank(end+1))end++;
      r=[top,end];}
    else if(ch.length===1&&!/[A-Za-z0-9\s]/.test(ch)){const pr=findPair(t,s.h,ch);if(!pr)return s;r=kind==='a'?pr:(pr[1]-pr[0]>1?[pr[0]+1,pr[1]-1]:null);if(!r)return s;}
    else return s;

 em:'surround',bold:'surround',code:'surround',mr:'surround',md:'surround',linktext:'textobj',linkurl:'textobj','fsp':'mov','t.':'mov','alt.':'mov',flip:'sel',slash:'search','*n':'search',
 CCi:'sel',check:'sel',quote:'sel','%s':'sel',alts:'sel',gd:'sel',comma:'sel',cmt:'sel',uncmt:'sel',value:'goto',quoted:'textobj',indent:'chg',dedent:'chg',incr:'chg',dupblock:'textobj',
 'r-redo':'chg','r-w':'cmds','r-file':'space','r-buf':'space','r-grep':'space','r-clipy':'space','r-clipp':'space','r-reflow':'cmds','r-gw':'goto','r-gdot':'goto','r-para':'unimp','r-rec':'chg','r-play':'chg','r-altd':'chg','r-pal':'space'};
const TUTDOC=['mov','selmode','sel','chg','textobj','keymap','sel','keymap'];
const docLink=k=>{const d=DOCS[k]||DOCS.keymap;return'<a class="link doc" href="'+DOC+d[1]+'" target="_blank" rel="noopener">Helix docs: '+esc(d[0])+' ↗</a>';};
const app={mode:'ladder',d:null,S:null,solved:false,peeked:false,tape:[],typed:[],misses:0,lastStars:0,flash:'',wipeArmed:false,
  sprint:{on:false,over:false,left:60,score:0,streak:0,count:0,timer:null,end:0}};

function unlocked(i){if(i===0||store.data.all)return true;if(!unlocked(i-1))return false;const p=STAGES[i-1].drills;return p.filter(d=>store.data.stars[d.id]).length>=Math.ceil(p.length*.6);}
function load(d){app.d=d;app.solved=false;app.peeked=false;app.tape=[];app.typed=[];app.misses=0;
  app.S=d.recall?null:newState(d.text,d.sels,d.primary);}
function firstOpen(si){const ds=STAGES[si].drills;return ds.find(d=>!store.data.stars[d.id])||ds[0];}
function nextDrill(){const d=app.d,ds=STAGES[d.si].drills;
  if(d.di+1<ds.length)return load(ds[d.di+1]);
  if(d.si+1<STAGES.length&&unlocked(d.si+1))return load(STAGES[d.si+1].drills[0]);
  load(firstOpen(d.si));}
function pool(){return ALL.filter(d=>unlocked(d.si));}
function sprintPick(){const p=pool().filter(d=>d!==app.d);load(p[Math.floor(Math.random()*p.length)]||ALL[0]);}
function sprintReset(){const s=app.sprint;clearInterval(s.timer);Object.assign(s,{on:false,over:false,left:60,score:0,streak:0,count:0,timer:null});app.flash='';sprintPick();}
function sprintStart(){const s=app.sprint;s.on=true;s.end=Date.now()+60000;
  s.timer=setInterval(()=>{s.left=Math.max(0,Math.ceil((s.end-Date.now())/1000));
    if(s.left<=0){clearInterval(s.timer);s.on=false;s.over=true;if(s.score>store.data.sprint){store.data.sprint=s.score;store.save();}}
    render();},250);}

function complete(){const d=app.d;let st;
  if(d.recall)st=app.misses===0?3:app.misses===1?2:1;
  else{const k=app.S.keys;st=k<=d.par?3:k<=Math.ceil(d.par*1.5)?2:1;}
  if(app.peeked)st=Math.min(st,2);
  app.lastStars=st;
  if(app.mode==='sprint'){const s=app.sprint;const gain=(st===3?150:100)+10*s.streak;s.score+=gain;s.streak++;s.count++;
    app.flash='+'+gain+'  '+d.keys.map(show).join(' ');sprintPick();return;}
  app.solved=true;
  if(st>(store.data.stars[d.id]||0)){store.data.stars[d.id]=st;store.save();}
}
app.tut={li:0,si:0,idx:0,S:null,miss:false,end:false};
function tutLoad(li,si){const T=app.tut;T.li=li;T.si=si;T.idx=0;T.miss=false;T.end=false;const st=TUTORIAL[li].steps[si];
  if(st.start){const p=parse(st.start);T.S=newState(p.text,p.sels);}else if(si===0)T.S=null;}
function tutKey(k){const T=app.tut,L=TUTORIAL[T.li],st=L.steps[T.si],keys=st.keys?st.keys.split(' '):[];
  if(T.end){if(k==='Enter'){app.mode='ladder';load(firstOpen(0));}return;}
  if(k==='Tab'){tutLoad(T.li,0);return;}
  if(T.idx<keys.length){if(k===keys[T.idx]){feed(T.S,k);T.idx++;T.miss=false;}else T.miss=true;return;}
  if(k!=='Enter')return;
  if(T.si+1<L.steps.length)return tutLoad(T.li,T.si+1);
  store.data.tut=store.data.tut||{};store.data.tut[T.li]=true;store.save();
  if(T.li+1<TUTORIAL.length)tutLoad(T.li+1,0);else T.end=true;}
function tutNav(){const done=store.data.tut||{};
  return TUTORIAL.map((L,li)=>'<div class="stage'+(app.tut.li===li&&!app.tut.end?' on':'')+'"><button class="stage-h" data-l="'+li+'"><span>'+(li+1)+'. '+esc(L.name)+'</span><span class="ok">'+(done[li]?'✓':'')+'</span></button></div>').join('');}
function renderTut(){const T=app.tut,hint='<div class="focus-hint">Click here to focus, then type.</div>';
  if(T.end){card.innerHTML='<div class="eyebrow"><span>Tutorial complete</span></div><h2 class="task">Select, then act. When one motion is not enough, hold the anchor with v.</h2><div class="next">Press <kbd>Enter</kbd> to start the Ladder.</div>'+hint;return;}
  const L=TUTORIAL[T.li],st=L.steps[T.si],keys=st.keys?st.keys.split(' '):[],done=T.idx>=keys.length,S=T.S;
  let h='<div class="eyebrow"><span>Lesson '+(T.li+1)+' of '+TUTORIAL.length+' · '+esc(L.name)+'</span><span>step '+(T.si+1)+' of '+L.steps.length+'</span></div>';
  h+='<div class="say">'+st.say+'</div>';
  const tdoc='<div class="next">'+docLink(TUTDOC[T.li])+'</div>';
  if(S)h+='<section class="pane"><div class="buf">'+bufHTML(S.text,S.sels,S.primary,S.mode)+'</div><div class="statusline"><span class="modetag">'+({normal:'NOR',insert:'INS',select:'SEL'}[S.mode])+'</span><span class="pend">'+esc(pendStr(S))+'</span><span class="right">'+S.sels.length+' sel</span></div></section>';
  if(keys.length)h+='<div class="prompt"><span class="lab">'+(done?'Pressed':'Press')+'</span>'+keys.map((k,i)=>'<kbd class="'+(i<T.idx?'hit':i===T.idx?'nextk':'')+'">'+esc(show(k))+'</kbd>').join('')+(T.miss?'<span class="misskey">Not that key.</span>':'')+'</div>';
  if(done){if(st.after)h+='<div class="say after">'+st.after+'</div>';h+='<div class="next"><kbd>Enter</kbd> continue · <kbd>Tab</kbd> restart lesson</div>';}
  card.innerHTML=h+tdoc+hint;}
function onKey(k){
  if(app.mode==='tutorial'){tutKey(k);return;}
  const sp=app.sprint;
  if(app.mode==='sprint'&&sp.over){if(k==='Enter')sprintReset();return;}
  if(k==='Tab'){if(app.mode==='sprint'){sp.streak=0;app.flash='skipped  '+app.d.keys.map(show).join(' ');sprintPick();}else load(app.d);return;}
  if(app.solved){if(k==='Enter')nextDrill();return;}
  if(app.mode==='sprint'&&!sp.on)sprintStart();
  const d=app.d;
  if(d.recall){app.typed.push(k);const i=app.typed.length-1;
    if(d.keys[i]!==k){app.misses++;app.typed=[];app.missFlash=true;if(app.mode==='sprint')sp.streak=0;}
    else if(app.typed.length===d.keys.length)complete();
    return;}
  app.tape.push(k);feed(app.S,k);
  if(isSolved(app.S,d))complete();
}

function bufHTML(text,sels,primary,mode){const cls=new Array(text.length).fill('');
  sels.forEach((s,i)=>{if(mode==='insert'){cls[s.h]+=' ibar';return;}
    const[lo,hi]=rng(s);for(let j=lo;j<=hi;j++)cls[j]+=' sel';cls[s.h]+=i===primary?' cur':' cur2';});
  let out='<div class="ln">';
  for(let i=0;i<text.length;i++){const c=text[i],k=cls[i].trim();
    if(c==='\n'){out+='<span class="'+k+'"> </span></div>';if(i<text.length-1)out+='<div class="ln">';}
    else out+=k?'<span class="'+k+'">'+esc(c)+'</span>':esc(c);}
  return out;}
function goalHTML(d){
  if(d.goalIn)return bufHTML(d.goalText,[{a:d.goalIn[0],h:d.goalIn[1]}],-1,'normal');
  if(d.goalSel)return bufHTML(d.goalText,d.goalSel.map(([a,h])=>({a,h})),0,'normal');
  if(d.goalHead!==undefined)return bufHTML(d.goalText,[pt(d.goalHead)],0,'normal');
  return bufHTML(d.goalText,[],0,'normal');}
function pendStr(S){if(S.prompt)return({s:'select:','/':'search:',':':':'}[S.prompt.kind])+S.prompt.buf+'▏';
  let p=S.pending;if(p===null)return S.count;if(p===' ')p='Space';p=p.replace('mr:','mr');return S.count+p;}

function renderStages(){
  $('stages').innerHTML=app.mode==='tutorial'?tutNav():STAGES.map((st,si)=>{const open=unlocked(si),done=st.drills.filter(d=>store.data.stars[d.id]).length;
    const on=app.mode==='ladder'&&app.d.si===si;
    const dots=st.drills.map(d=>{const n=store.data.stars[d.id]||0;return'<button class="dot s'+n+(app.mode==='ladder'&&app.d===d?' here':'')+'" data-d="'+si+','+d.di+'" title="'+esc(d.task)+'" aria-label="Drill '+(d.di+1)+', '+n+' stars"'+(open?'':' disabled')+'>'+(n?n:'')+'</button>';}).join('');
    return'<div class="stage'+(on?' on':'')+(open?'':' locked')+'"><button class="stage-h" data-s="'+si+'"'+(open?'':' disabled')+'><span>'+(si+1)+'. '+esc(st.name)+'</span><span>'+done+'/'+st.drills.length+'</span></button><div class="dots">'+dots+'</div>'+(open?'':'<div class="lockmsg">Clear 60% of the previous stage</div>')+'</div>';}).join('');
  const total=ALL.length*3,got=ALL.reduce((a,d)=>a+(store.data.stars[d.id]||0),0),f=got/total;
  $('rank').innerHTML='<b>'+(f<.25?'Hunting for keys':f<.5?'Selects before acting':f<.8?'Thinks in selections':'hx native')+'</b>';
  $('starcount').textContent='★ '+got+'/'+total;
  $('unlock').textContent=store.data.all?'Re-lock stages':'Unlock all stages';
  $('wipe').textContent=app.wipeArmed?'Click again to confirm':'Reset progress';
}
function render(){
  const d=app.d,S=app.S,sp=app.sprint,sprint=app.mode==='sprint';
  $('mTut').setAttribute('aria-pressed',app.mode==='tutorial');$('mLadder').setAttribute('aria-pressed',app.mode==='ladder');$('mSprint').setAttribute('aria-pressed',sprint);
  renderStages();
  if(app.mode==='tutorial'){renderTut();return;}
  if(sprint&&sp.over){card.innerHTML='<div class="eyebrow"><span>Sprint over</span><span>best '+Math.max(store.data.sprint,sp.score)+'</span></div><div class="big">'+sp.score+'</div><p class="task">'+sp.count+' drills in 60 seconds.</p><div class="next">Press <kbd>Enter</kbd> to go again.</div><div class="focus-hint">Click here to focus, then type.</div>';return;}
  const st=STAGES[d.si];let h='';
  if(sprint)h+='<div class="eyebrow"><span>'+(sp.on?'':'Starts on your first key · ')+esc(st.name)+'</span><span>'+sp.left+'s · score '+sp.score+' · streak '+sp.streak+' · best '+store.data.sprint+'</span></div>';
  else h+='<div class="eyebrow"><span>Stage '+(d.si+1)+' · '+esc(st.name)+'</span><span>drill '+(d.di+1)+' of '+st.drills.length+(store.data.stars[d.id]?' · best '+starStr(store.data.stars[d.id]):'')+'</span></div>';
  h+='<h2 class="task">'+esc(d.task)+'</h2>';
  h+='<div class="chips">'+(d.evil?'<span class="chip vim"><span class="lab">in vim</span><kbd>'+esc(d.evil)+'</kbd></span>':'');
  if(app.peeked||app.solved)h+='<span class="chip hx"><span class="lab">hx</span>'+kbds(d.keys)+'</span>';
  else if(!sprint)h+='<button class="link" id="peek">Show hx keys (caps this drill at ★★)</button>';
  h+=docLink(DRILLDOC[d.id])+'</div>';
  if(app.peeked&&!app.solved&&d.mn)h+='<p class="mn"><b>Mnemonic</b> '+esc(d.mn)+'</p>';
  if(d.recall){
    h+='<div class="recall'+(app.missFlash?' miss':'')+'">'+(app.solved?kbds(d.keys):app.typed.length?kbds(app.typed):'<span class="none">'+(app.missFlash?'Not that. Try again.':'Type the chord.')+'</span>')+'</div>';
    app.missFlash=false;
  }else{
    const over=S.keys>d.par;
    h+='<div class="panes"><section class="pane"><h3>Buffer</h3><div class="buf">'+bufHTML(S.text,S.sels,S.primary,S.mode)+'</div>'
     +'<div class="statusline"><span class="modetag">'+({normal:'NOR',insert:'INS',select:'SEL'}[S.mode])+'</span><span class="pend">'+esc(pendStr(S))+'</span><span class="right">'+S.sels.length+' sel · <span class="'+(over?'over':'')+'">'+S.keys+' keys</span> · par '+d.par+'</span></div></section>'
     +'<section class="pane"><h3>Target</h3><div class="buf goal">'+goalHTML(d)+'</div></section></div>';
    h+='<div class="tape">'+(app.tape.length?kbds(app.tape.slice(-28)):'<span class="none">Keys you press show up here.</span>')+'</div>';
  }
  if(sprint)h+='<div class="flash">'+esc(app.flash)+'</div>';
  if(app.solved){const k=d.recall?null:S.keys;
    h+='<div class="result"><div class="head"><span class="stars">'+starStr(app.lastStars)+'</span><span>'+(d.recall?(app.misses?app.misses+' miss'+(app.misses>1?'es':''):'first try'):k+' keys, par '+d.par+(k<d.par?' (under par)':''))+'</span></div><p class="why">'+esc(d.why)+'</p>'+(d.mn?'<p class="mn"><b>Mnemonic</b> '+esc(d.mn)+'</p>':'')+'<div class="next"><kbd>Enter</kbd> next · <kbd>Tab</kbd> retry</div></div>';}
  h+='<div class="focus-hint">Click here to focus, then type.</div>';
  card.innerHTML=h;
}

const CODE={Semicolon:';:',Period:'.>',Comma:',<',Backquote:'`~',Minus:'-_',Equal:'=+',Slash:'/?',Quote:'\'"',BracketLeft:'[{',BracketRight:']}',Backslash:'\\|'};
function token(e){
  if(e.metaKey)return null;const k=e.key;
  if(e.ctrlKey){if(k==='[')return'Esc';if(k.length===1&&!'rtwnl'.includes(k.toLowerCase()))return'C-'+k.toLowerCase();return null;}
  if(e.altKey){const c=e.code;let ch=null;
    if(/^Key[A-Z]$/.test(c))ch=e.shiftKey?c[3]:c[3].toLowerCase();
    else if(/^Digit\d$/.test(c))ch=e.shiftKey?')!@#$%^&*('[+c[5]]:c[5];
    else if(CODE[c])ch=CODE[c][e.shiftKey?1:0];
    return ch?'A-'+ch:null;}
  if(k==='Escape')return'Esc';if(k==='Enter'||k==='Backspace')return k;
  if(k==='Tab')return e.shiftKey?null:'Tab';
  if(k===' ')return'Space';if(k.length===1)return k;return null;
}
card.addEventListener('keydown',e=>{const k=token(e);if(!k)return;e.preventDefault();onKey(k);render();});
card.addEventListener('click',e=>{if(e.target.id==='peek'){app.peeked=true;render();}card.focus({preventScroll:true});});
$('mTut').addEventListener('click',()=>{clearInterval(app.sprint.timer);app.mode='tutorial';const done=store.data.tut||{};let li=TUTORIAL.findIndex((L,i)=>!done[i]);tutLoad(li<0?0:li,0);render();card.focus({preventScroll:true});});
$('stages').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.l!==undefined){tutLoad(+b.dataset.l,0);render();card.focus({preventScroll:true});return;}
  if(app.mode==='sprint'){clearInterval(app.sprint.timer);app.mode='ladder';}
  if(b.dataset.d){const[si,di]=b.dataset.d.split(',').map(Number);load(STAGES[si].drills[di]);}else load(firstOpen(+b.dataset.s));
  render();card.focus({preventScroll:true});});
$('mLadder').addEventListener('click',()=>{clearInterval(app.sprint.timer);app.mode='ladder';load(firstOpen(app.d.si));render();card.focus({preventScroll:true});});
$('mSprint').addEventListener('click',()=>{app.mode='sprint';sprintReset();render();card.focus({preventScroll:true});});
$('unlock').addEventListener('click',()=>{store.data.all=!store.data.all;store.save();render();});
$('wipe').addEventListener('click',()=>{if(!app.wipeArmed){app.wipeArmed=true;render();return;}
  app.wipeArmed=false;store.data={stars:{},sprint:0,all:false};store.save();load(ALL[0]);render();});

(function start(){let si=0;for(let i=0;i<STAGES.length;i++)if(unlocked(i)&&STAGES[i].drills.some(d=>!store.data.stars[d.id])){si=i;break;}
  load(firstOpen(si));render();card.focus({preventScroll:true});})();
</script>
